<!--
================================================================
Worked-Example-Snippet (Profil: Worked Examples)
================================================================

CSS + HTML-Pattern für die drei Stufen eines Worked Example:
1. Vollständig gelöstes Beispiel (mit Self-Explanation-Prompts)
2. Faded Stufe: Aufgabe mit Lücken-Eingabefeldern
3. Analoge Aufgabe: voll selbständig

Voraussetzung: ADR-0011 Selbst-Korrektur ist im Boilerplate aktiv
(data-expected, data-tolerance, data-expected-keywords).

ANWENDUNG
-----------------------------------------------------------------
1. CSS in den <style>-Bereich kopieren
2. HTML-Pattern dreimal hintereinander einsetzen
3. Inhalte profil- und fach-spezifisch einfüllen

================================================================
-->


<!-- CSS — in <style> einfügen -->
<style>
  /* Stufe 1: Worked Example (vollständig gezeigt) */
  .worked-example {
    background: linear-gradient(180deg, #FFFBF0 0%, var(--bg-page) 100%);
    border: 1px solid var(--gold);
    border-left: 4px solid var(--gold);
    border-radius: var(--radius-md);
    padding: var(--space-4) var(--space-5);
    margin: var(--space-6) 0;
  }
  @media (prefers-color-scheme: dark) {
    .worked-example { background: linear-gradient(180deg, #2a2310 0%, var(--bg-page) 100%); }
  }
  .we-badge {
    display: inline-block;
    background: var(--gold); color: var(--navy);
    font-size: var(--fs-xs); font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 2px var(--space-3); border-radius: 999px;
    margin-bottom: var(--space-2);
  }
  .worked-example h3 {
    margin: 0 0 var(--space-3);
    font-family: var(--font-serif);
    font-size: var(--fs-h3);
    color: var(--navy);
  }
  .we-problem {
    background: var(--bg-page);
    border-left: 3px solid var(--blue);
    padding: var(--space-2) var(--space-4);
    margin: var(--space-3) 0;
    font-style: italic;
  }
  .we-steps {
    list-style: none;
    padding: 0;
    counter-reset: we-step;
    margin: var(--space-3) 0;
  }
  .we-steps li {
    counter-increment: we-step;
    padding: var(--space-2) 0 var(--space-2) var(--space-8);
    position: relative;
    margin-bottom: var(--space-2);
  }
  .we-steps li::before {
    content: counter(we-step);
    position: absolute;
    left: 0; top: var(--space-2);
    width: 24px; height: 24px;
    background: var(--navy); color: #fff;
    border-radius: 50%;
    font-size: var(--fs-sm); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .we-steps li strong { color: var(--navy); }
  .we-warum {
    margin-top: var(--space-1);
    background: var(--bg-info);
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-sm);
    border-left: 2px solid var(--blue);
    font-size: var(--fs-sm);
  }
  .we-warum summary {
    cursor: pointer;
    color: var(--blue);
    font-weight: 600;
  }
  .we-warum[open] summary { margin-bottom: var(--space-1); }
  .we-answer {
    background: var(--bg-info);
    border-left: 3px solid var(--green);
    padding: var(--space-2) var(--space-4);
    margin-top: var(--space-3);
    font-weight: 600;
    color: var(--navy);
  }

  /* Stufe 2: Faded — Aufgabe mit Lücken */
  .we-faded {
    border-top-color: var(--blue);
  }
  .we-faded .aufgabe__nr {
    background: var(--blue); color: #fff;
  }
  .we-faded-steps {
    list-style: none;
    padding: 0;
    counter-reset: faded-step;
  }
  .we-faded-steps li {
    counter-increment: faded-step;
    padding: var(--space-2) 0 var(--space-2) var(--space-8);
    position: relative;
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .we-faded-steps li::before {
    content: counter(faded-step);
    position: absolute;
    left: 0; top: var(--space-2);
    width: 24px; height: 24px;
    background: var(--blue); color: #fff;
    border-radius: 50%;
    font-size: var(--fs-sm); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .we-faded-steps input {
    flex: 1; min-width: 80px; max-width: 240px;
    display: inline-block;
  }

  /* Stufe 3: Analoge Aufgabe — visuell wie normale Aufgabe-Karte
     (border-top-color bleibt gold, das ist Standard ADR-0018) */
  .we-analog .aufgabe__nr {
    background: var(--green); color: #fff;
  }
</style>
