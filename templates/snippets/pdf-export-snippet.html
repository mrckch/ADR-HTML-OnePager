<!--
================================================================
PDF-Export-Snippet (ADR-0021)
================================================================

Dieses Snippet erweitert einen Onepager um einen PDF-Export, der
das gesamte .page-Element inkl. Canvas-Zeichnungen pixelgenau in
eine A4-PDF-Datei rendert. Geeignet für GoodNotes-Import oder
physischen Druck.

WICHTIG — Seitenumbruch (ADR-0023):
-----------------------------------------------------------------
Der Export respektiert <hr class="page-break-hint">-Elemente: an
jeder Stelle, an der dieser Marker steht, beginnt eine neue PDF-
Seite. So werden Aufgaben-Karten nicht zerschnitten. Setze die
Marker beim Bauen deines Onepagers an passenden Stellen — siehe
A4-Vorschau (?layout=a4).

Wenn ein Abschnitt zwischen zwei Markern zu lang für eine A4-
Seite ist, wird er automatisch weiter aufgeteilt. Das ist Notfall-
Verhalten; besser ist es, dann selbst einen weiteren Marker zu
setzen.


ANWENDUNG
-----------------------------------------------------------------
1. Inline-Bibliotheken besorgen (einmal pro Onepager):

   curl -s https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js \
        -o /tmp/html2canvas.min.js
   curl -s https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js \
        -o /tmp/jspdf.umd.min.js

   Inhalte zwischen die unteren PASTE-Marker einfügen.

2. Den GESAMTEN Inhalt dieses Snippets (CSS + HTML + JS-Block) in
   dein onepager.html einfügen:
     - CSS-Block: in den <style>...</style>-Bereich
     - HTML-Block (Button): in den <nav> der Topbar
     - HTML-Block (Modal): in den <body>, neben anderen Modals
     - JS-Block: am Ende des bestehenden <script>...</script>-Blocks

3. Funktioniert ohne A4-Vorschau, ist aber besser, wenn man vorher
   mit ?layout=a4 die Seite prüft.


LIZENZ-HINWEIS
-----------------------------------------------------------------
html2canvas: MIT (Niklas von Hertzen)
jsPDF:       MIT (yWorks / Parallax Innovations)
Die Header-Kommentare in den minifizierten Codes müssen erhalten
bleiben.

================================================================
-->


<!-- ============================================================
     CSS — in den bestehenden <style>-Block einfügen
     ============================================================ -->
<style>
  /* PDF-Render-Modus: Topbar, Modals, Toast ausblenden */
  body.pdf-rendering .topbar,
  body.pdf-rendering .modal,
  body.pdf-rendering #toast { display: none !important; }

  /* page-break-hint-Marker im PDF unsichtbar machen — aber Höhe
     bleibt, damit die Y-Position für das Splitting korrekt ist.
     Ohne diese Regel würde der gestrichelte Trenner und der Text
     "Seitenumbruch beim Drucken" im PDF auftauchen. */
  body.pdf-rendering .page-break-hint {
    border-top-color: transparent !important;
  }
  body.pdf-rendering .page-break-hint::after { display: none !important; }

  /* Fortschritts-Modal während des Renderns */
  #pdf-progress[hidden] { display: none; }
  #pdf-progress {
    position: fixed; inset: 0; z-index: 300;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
  }
  #pdf-progress .modal__panel {
    background: var(--bg-page);
    border-radius: var(--radius-lg);
    border-top: 4px solid var(--gold);
    max-width: 400px; width: 90%;
    padding: var(--space-6);
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  #pdf-progress .progress-bar {
    height: 8px; background: var(--bg-elevated);
    border-radius: 999px; overflow: hidden;
    margin-top: var(--space-4);
  }
  #pdf-progress .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--green));
    transition: width .3s;
  }
</style>


<!-- ============================================================
     HTML — in <nav class="topbar nav"> ergänzen (zwischen den
     bestehenden Buttons)
     ============================================================ -->
<button type="button" class="tb-btn tb-btn--pdf" data-action="export-pdf"
        title="Als A4-PDF speichern (für GoodNotes oder Druck)">
  <span aria-hidden="true">📄</span> <span class="label">PDF</span>
</button>

<!-- HTML — am Ende des <body>, neben anderen Modals -->
<div id="pdf-progress" role="dialog" aria-modal="true"
     aria-labelledby="pdf-progress-title" hidden>
  <div class="modal__panel">
    <h2 id="pdf-progress-title">📄 PDF wird erstellt …</h2>
    <p id="pdf-progress-label">Einen Moment.</p>
    <div class="progress-bar"><div class="progress-fill" id="pdf-progress-fill"></div></div>
  </div>
</div>


<!-- ============================================================
     JS — am Ende des bestehenden <script>-Blocks einfügen
     ============================================================ -->
<script>
/* ===== PASTE html2canvas v1.4.1 MINIFIED HERE =====
   Inhalt aus /tmp/html2canvas.min.js einfügen.
   Wichtig: den Lizenz-Header oben drin lassen.
=================================================== */

/* ===== PASTE jsPDF v2.5.1 UMD MINIFIED HERE =====
   Inhalt aus /tmp/jspdf.umd.min.js einfügen.
   Wichtig: den Lizenz-Header oben drin lassen.
================================================== */

/* PDF-Export-Funktion (ADR-0021) — mit page-break-aware A4-Splitting */
async function exportPDF() {
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    showToast('PDF-Bibliotheken nicht eingebettet — siehe Snippet-Anleitung.',
              { kind: 'error' });
    return;
  }
  commitSave();

  const progress = document.getElementById('pdf-progress');
  const fill     = document.getElementById('pdf-progress-fill');
  const label    = document.getElementById('pdf-progress-label');
  progress.hidden = false;
  fill.style.width = '5%';
  label.textContent = 'Seite wird vorbereitet …';

  // A4-Vorschau temporär aktivieren — damit die .page exakt 210mm breit
  // ist und das Layout dem späteren PDF entspricht.
  const wasPreview = document.body.classList.contains('a4-preview');
  if (!wasPreview) setA4Preview(true);
  document.body.classList.add('pdf-rendering');

  // Zwei requestAnimationFrame-Wartezyklen, damit der Browser sicher
  // das neue Layout (a4-preview + pdf-rendering CSS) angewendet hat.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    const target = document.querySelector('.page');
    const targetRect = target.getBoundingClientRect();

    // --- Schritt 1: Positionen aller page-break-hint sammeln (in CSS-Pixeln,
    //                relativ zum target). Das machen wir VOR html2canvas,
    //                weil getBoundingClientRect() vom Live-DOM kommt.
    const breaks = Array.from(target.querySelectorAll('.page-break-hint'));
    const breakBoundsCss = breaks.map(b => {
      const r = b.getBoundingClientRect();
      return {
        top:    r.top    - targetRect.top,
        bottom: r.bottom - targetRect.top
      };
    });

    fill.style.width = '20%';
    label.textContent = 'Seite wird gerendert …';

    // --- Schritt 2: html2canvas rendert das ganze .page-Element
    const renderScale = 2;
    const canvas = await html2canvas(target, {
      scale: renderScale,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    });

    fill.style.width = '60%';
    label.textContent = 'PDF wird zusammengesetzt …';

    // --- Schritt 3: CSS-Pixel-Y-Positionen auf Canvas-Pixel umrechnen
    //                Canvas-Höhe / target-Höhe = Skala (sollte renderScale sein,
    //                aber sicherheitshalber rechnen)
    const realScale = canvas.height / targetRect.height;
    const breakBounds = breakBoundsCss.map(bb => ({
      top:    bb.top    * realScale,
      bottom: bb.bottom * realScale
    }));

    // --- Schritt 4: Segments bauen
    //   Segment k läuft von (Bottom des vorigen breaks ODER 0)
    //              bis (Top des nächsten breaks ODER canvas.height)
    const segments = [];
    let cursor = 0;
    for (const bb of breakBounds) {
      if (bb.top > cursor + 1) {  // +1 um Rundungsfehler zu umgehen
        segments.push({ start: cursor, end: bb.top });
      }
      cursor = bb.bottom;
    }
    if (cursor < canvas.height - 1) {
      segments.push({ start: cursor, end: canvas.height });
    }
    // Fallback: wenn keine Segments (z. B. nur Breaks und sonst nichts),
    // dann ein einziger Segment über das gesamte Canvas
    if (!segments.length) {
      segments.push({ start: 0, end: canvas.height });
    }

    // --- Schritt 5: A4-PDF erstellen, pro Segment eine (oder mehrere) Seite(n)
    const pdfWmm   = 210;    // A4-Breite
    const pageHmm  = 297;    // A4-Höhe
    const mmPerPx  = pdfWmm / canvas.width;
    const maxChunkPx = Math.floor(pageHmm / mmPerPx);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    let firstPage = true;
    let segIdx = 0;

    for (const seg of segments) {
      let segCursor = seg.start;
      while (segCursor < seg.end - 0.5) {
        const chunkHeightPx = Math.min(seg.end - segCursor, maxChunkPx);
        const chunkHeightMm = chunkHeightPx * mmPerPx;

        // Temp-Canvas mit nur diesem Chunk
        const temp = document.createElement('canvas');
        temp.width  = canvas.width;
        temp.height = Math.ceil(chunkHeightPx);
        const tctx = temp.getContext('2d');
        tctx.fillStyle = '#ffffff';
        tctx.fillRect(0, 0, temp.width, temp.height);
        tctx.drawImage(canvas, 0, -segCursor);

        if (!firstPage) pdf.addPage();
        firstPage = false;

        const imgData = temp.toDataURL('image/jpeg', 0.92);
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWmm, chunkHeightMm, '', 'FAST');

        segCursor += chunkHeightPx;
      }
      segIdx++;
      fill.style.width = (60 + Math.round(30 * segIdx / segments.length)) + '%';
    }

    fill.style.width = '95%';
    label.textContent = 'Datei wird gespeichert …';

    const name = (document.getElementById('meta-name')?.value || 'schueler')
      .replace(/[^a-zA-Z0-9_-]/g, '_');
    const date = new Date().toISOString().slice(0, 10);
    pdf.save(`${ONEPAGER_SLUG}__${name}__${date}.pdf`);

    fill.style.width = '100%';
    setTimeout(() => { progress.hidden = true; fill.style.width = '0%'; }, 600);
    showToast('PDF gespeichert.');
  } catch (err) {
    console.warn(err);
    progress.hidden = true; fill.style.width = '0%';
    showToast('PDF-Export fehlgeschlagen: ' + (err.message || 'Fehler'),
              { kind: 'error' });
  } finally {
    document.body.classList.remove('pdf-rendering');
    if (!wasPreview) setA4Preview(false);
  }
}

// Topbar-Action-Handler für "export-pdf" registrieren.
// Funktioniert zusätzlich zum bestehenden Topbar-Click-Handler.
document.querySelector('.topbar nav').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action="export-pdf"]');
  if (btn) exportPDF();
});
</script>
